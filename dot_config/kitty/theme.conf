# vim:ft=kitty
## name:     Transparent Prism - Obsidian
## author:   Converted from a COSMIC desktop theme (Dark.ron)
## blurb:    Dark translucent purple-black background with a Monokai-style accent palette.

#: Basic colors ---------------------------------------------------------

# bg_color        #0D081AD1  (alpha 0xD1 = 82%)
# neutral_10      #F7F2FF
background              #0D081A
foreground              #F7F2FF

selection_background    #4C4557
selection_foreground    #F7F2FF

#: Cursor ---------------------------------------------------------------

# accent          #948AE3
cursor                  #948AE3
cursor_text_color       #0D081A

#: URLs -----------------------------------------------------------------

# accent_blue     #59D4E6
url_color               #59D4E6

#: Borders and splits ---------------------------------------------------

active_border_color     #948AE3
inactive_border_color   #4C4557
bell_border_color       #FCE666

#: Tab bar --------------------------------------------------------------

active_tab_background   #948AE3
active_tab_foreground   #1C1426
active_tab_font_style   bold
inactive_tab_background #2B2638
inactive_tab_foreground #BFBACC
inactive_tab_font_style normal
tab_bar_background      #241F30

#: Window ---------------------------------------------------------------

background_opacity      0.6
dynamic_background_opacity yes
background_blur         1

#: Marks ----------------------------------------------------------------

mark1_foreground #0D081A
mark1_background #948AE3
mark2_foreground #0D081A
mark2_background #59D4E6
mark3_foreground #0D081A
mark3_background #FCE666

#: The 16 terminal colors -----------------------------------------------

#: black (gray_1 / neutral_7)
color0  #302B3D
color8  #70697A

#: red (accent_red / bright_red)
color1  #FC618C
color9  #FC618C

#: green (accent_green / bright_green)
color2  #7AD98F
color10 #7AD98F

#: yellow (accent_yellow)
color3  #FCE666
color11 #FCE666

#: blue (accent_orange — the palette has no true blue; see note)
color4  #FC9454
color12 #FC9454

#: magenta (accent_purple / accent_indigo)
color5  #948AE3
color13 #948AE3

#: cyan (accent_blue)
color6  #59D4E6
color14 #59D4E6

#: white (neutral_9 / neutral_10)
color7  #BFBACC
color15 #F7F2FF
